name: Deploy

# Runs after CI passes on main. The image CI built for that commit goes to
# Test, then Staging (with the Playwright tests), then Production after approval.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  EC2_HOST: ${{ vars.EC2_HOST }}

jobs:
  test:
    name: Deploy to Test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: http://${{ vars.EC2_HOST }}:8081
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy deploy files to the server
        run: rsync -az --delete --exclude .git --exclude node_modules -e "ssh -i ~/.ssh/id_deploy" ./ "deploy@$EC2_HOST:fixlog/"

      - name: Deploy and smoke test
        run: ssh -i ~/.ssh/id_deploy "deploy@$EC2_HOST" "bash fixlog/deploy/deploy.sh test $IMAGE_TAG"

  staging:
    name: Deploy to Staging and run E2E tests
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://${{ vars.EC2_HOST }}:8082
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy deploy files to the server
        run: rsync -az --delete --exclude .git --exclude node_modules -e "ssh -i ~/.ssh/id_deploy" ./ "deploy@$EC2_HOST:fixlog/"

      - name: Deploy and smoke test
        run: ssh -i ~/.ssh/id_deploy "deploy@$EC2_HOST" "bash fixlog/deploy/deploy.sh staging $IMAGE_TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests against Staging
        working-directory: e2e
        env:
          BASE_URL: http://${{ vars.EC2_HOST }}:8082
          EXPECTED_VERSION: ${{ env.IMAGE_TAG }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  production:
    name: Deploy to Production
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy deploy files to the server
        run: rsync -az --delete --exclude .git --exclude node_modules -e "ssh -i ~/.ssh/id_deploy" ./ "deploy@$EC2_HOST:fixlog/"

      - name: Deploy, smoke test and roll back on failure
        run: ssh -i ~/.ssh/id_deploy "deploy@$EC2_HOST" "bash fixlog/deploy/deploy.sh prod $IMAGE_TAG"
