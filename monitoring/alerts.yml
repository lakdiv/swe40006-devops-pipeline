groups:
  - name: fixlog-production
    rules:
      - alert: HighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 80% for 5 minutes"

      - alert: HighMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% of host memory available for 5 minutes"

      - alert: LowDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% disk space free on / for 10 minutes"

      - alert: AppDown
        expr: up{job="fixlog-prod"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FixLog Production is not answering on /metrics"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(fixlog_http_request_duration_seconds_bucket{job="fixlog-prod", route!="/metrics"}[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FixLog Production 95th percentile latency above 0.5 s for 5 minutes"
