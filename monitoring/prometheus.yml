global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/fixlog/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics. Node Exporter runs on the host network.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # FixLog Production, reached over the shared monitoring network.
  - job_name: fixlog-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["fixlog-prod-app:3000"]
