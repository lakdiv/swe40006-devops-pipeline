# Server base file shared by Test, Staging and Production.
# Pulls the CI image from GHCR. The database publishes no host port.
# Always used together with one override file, through deploy.sh.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixlog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      POSTGRES_DB: fixlog
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixlog -d fixlog"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  app:
    image: ghcr.io/lakdiv/fixlog:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fixlog:${DB_PASSWORD}@db:5432/fixlog
      APP_VERSION: ${IMAGE_TAG}
      APP_ENV: ${APP_ENV:-unknown}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m

volumes:
  dbdata:
